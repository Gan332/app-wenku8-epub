[versions]
agp = "9.4.1"
kotlin = "2.4.20"
miuix = "0.9.4"
activity = "1.13.0"
androidxCore = "1.17.0"
lifecycle = "2.10.0"
compose = "1.12.0"
serialization = "1.9.0"
okhttp = "4.12.0"
jsoup = "1.18.3"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
datastore = "1.1.7"
security = "1.1.0-alpha06"
documentfile = "1.0.1"
# LNR 阅读器引入（0.12.0）：api 子集的 Result 类型与组件数据 HTML 序列化
kotlinResult = "2.3.1"
dom4j = "2.2.0"
navigation3Runtime = "1.1.7"
# xy-reader 阅读器引入（0.13.0）：压缩包页面源
commonsCompress = "1.27.1"
junrar = "7.5.5"

[libraries]
# 0.9.3 起 material / material3 / material-icons 全量移除（界面统一 MiuiX），对应依赖项一并删除
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security" }
# MiuiX 0.9.x 起改用 miuix-ui 坐标（旧的 miuix 坐标止于 0.8.8）
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-core = { module = "top.yukonga.miuix.kmp:miuix-core", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.1" }
google-material = { module = "com.google.android.material:material", version = "1.12.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-result = { module = "com.michael-bull.kotlin-result:kotlin-result", version.ref = "kotlinResult" }
kotlin-result-coroutines = { module = "com.michael-bull.kotlin-result:kotlin-result-coroutines", version.ref = "kotlinResult" }
dom4j = { module = "org.dom4j:dom4j", version.ref = "dom4j" }
# api 子集的 WebBookDataSource 实现 NavKey 接口（纯运行时标记，不引 navigation UI）
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3Runtime" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
# 压缩包页面源：zip/7z/tar 用 commons-compress，rar 用 junrar（UnRAR License，仅解压）
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
junrar = { module = "com.github.junrar:junrar", version.ref = "junrar" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
