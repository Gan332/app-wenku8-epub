# PR 路径标签。与 .github/workflows/pr-labeler.yml 配套。
# 只做“加标签”，sync-labels 保持关闭，避免把 Dependabot 的 dependencies 标签删掉。
android:
  - changed-files:
      - any-glob-to-any-file:
          - "android/**"

rust:
  - changed-files:
      - any-glob-to-any-file:
          - "rust/**"

web:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**"
          - "public/**"
          - "test/**"
          - "server.js"
          - "package.json"
          - "package-lock.json"

relay:
  - changed-files:
      - any-glob-to-any-file:
          - "relay/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
