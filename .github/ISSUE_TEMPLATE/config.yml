  - name: 使用前请先读 AGENTS.md
    url: https://github.com/Gan332/app-wenku8-epub/blob/main/AGENTS.md
    about: |
      工程约定、信息架构原则与安全红线都写在这里。
      尤其是「4.6.1 阅读优先」——本项目坚持「读者打开应用是为了读，不是为了导出」，
      与该原则冲突的功能请求会先被引导讨论。
