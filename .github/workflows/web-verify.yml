name: Web verify

# Node 网页版自己的一套门禁（npm run verify = 语法检查 + 单测 + EPUB 冒烟）。
# 与 android-apk.yml 按路径分工：只改网页文件时不会再触发 7 分钟的 Android 构建。
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'test/**'
      - 'relay/**'
      - 'scripts/**/*.js'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-verify.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'test/**'
      - 'relay/**'
      - 'scripts/**/*.js'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      # relay/worker.js 是 ESM，而根 package.json 是 commonjs；
      # 用 stdin + --input-type=module 校验语法，避免误按 CommonJS 解析。
      - name: Check relay worker syntax
        run: node --input-type=module --check < relay/worker.js
