name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  # 缓存水位脚本要删条目（scripts/ci-trim-cache.sh）。只给 contents: write 时其余权限全为 none。
  actions: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build native Compose APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # MiuiX 0.9.4 要求 compileSdk 37。注意 SDK 37 引入小版本号，
          # 公共仓库里没有 platforms;android-37，基础包是 platforms;android-37.0
          # （其 source.properties 为 ApiLevel=37.0 / IsBaseSdk=true）。
          # NDK：cargo-ndk 交叉编译 rust/epub-core（libepub_core.so）需要。
          "$SDKMANAGER" 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.2.12479018'

      - name: Set up Rust
        # 固定到 v1（官方推荐写法）：@stable 会随上游改动，工具链要做到可复现。
        uses: dtolnay/rust-toolchain@v1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml') }}

      # 缓存水位控制。必须在 Cache Rust 之后（要先 restore 再算占用），
      # 且放在所有构建步骤之前，这样清出的空间本次构建就能用上。
      - name: Trim Actions cache when near the quota
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_MAX_MB: '10240'
          CACHE_THRESHOLD_PCT: '90'
          CACHE_TARGET_PCT: '70'
        run: bash scripts/ci-trim-cache.sh

      - name: Rust tests
        working-directory: rust
        run: cargo test --locked || cargo test

      - name: Build native epub core
        working-directory: rust
        # cargo-ndk 装一次后进缓存（~/.cargo/bin）；产物 so 拷进 jniLibs（不入库），
        # gradle 自动打包；本地无 so 时 Kotlin 侧 available=false 走 legacy 回退。
        run: |
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armv7-linux-androideabi -t x86_64-linux-android \
            -o ../android/app/src/main/jniLibs \
            build --release -p epub-core

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 必须与 android/gradle/wrapper/gradle-wrapper.properties 的 distributionUrl 一致：
          # AGP 的版本检查会把两处不匹配直接判为构建失败（AGENTS §2 踩坑记录第 4 条）。
          gradle-version: '9.8.1'

      - name: Run Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK (R8)
        working-directory: android
        # 签名口令一律走 env，不直接插值进脚本（避免脚本注入）。
        # 未配置 Secrets 时在脚本内跳过，不退回 debug 签名冒充。
        env:
          HYPERREADER_KEYSTORE: ${{ runner.temp }}/release.keystore
          HYPERREADER_KEYSTORE_B64: ${{ secrets.HYPERREADER_KEYSTORE }}
          HYPERREADER_STORE_PASSWORD: ${{ secrets.HYPERREADER_STORE_PASSWORD }}
          HYPERREADER_KEY_ALIAS: ${{ secrets.HYPERREADER_KEY_ALIAS }}
          HYPERREADER_KEY_PASSWORD: ${{ secrets.HYPERREADER_KEY_PASSWORD }}
        run: |
          if [ -z "$HYPERREADER_KEYSTORE_B64" ] || [ -z "$HYPERREADER_STORE_PASSWORD" ] || [ -z "$HYPERREADER_KEY_ALIAS" ]; then
            echo "::notice::未配置签名 Secrets（HYPERREADER_*），跳过 release 构建"
            exit 0
          fi
          printf '%s' "$HYPERREADER_KEYSTORE_B64" | base64 -d > "$HYPERREADER_KEYSTORE"
          gradle assembleRelease --no-daemon --stacktrace
          rm -f "$HYPERREADER_KEYSTORE"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperreader-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: wenku8-epub-studio-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false

      # 固定下载入口（日常装机用）。
      #
      # 原先前者要下 APK 得进 Actions 页面开运行、再下载 artifact 的 zip（14 天过期、
      # 还要解压）。这里把 main 上**通过全部检查**的构建挂到固定标签 `ci-latest` 上，
      # 于是下载地址永不变化：
      #   https://github.com/Gan332/app-wenku8-epub/releases/download/ci-latest/app-release.apk
      #   https://github.com/Gan332/app-wenku8-epub/releases/download/ci-latest/app-debug.apk
      #
      # 只在 push 到 main 且前面的步骤全部成功时执行，因此这一个 URL 天然只承载绿灯构建；
      # 失败的那次推送不会覆盖它（用户拿到的永远是最新可用版本，而不是半成品）。
      # 标签 `ci-latest` 不匹配触发用的 'v*'，不会自触发新一轮构建。
      - name: Refresh rolling CI release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git_sha="$(git rev-parse HEAD)"
          git_short="${git_sha:0:7}"
          version_name="$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -n 1)"
          version_code="$(grep -oP 'versionCode = \K\d+' android/app/build.gradle.kts | head -n 1)"
          release_apk="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          debug_apk="$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)"
          title="文库 EPUB 工坊 · CI 最新构建 (main)"
          notes="$RUNNER_TEMP/ci-latest-notes.md"

          # 中文说明留在 workflow 里而不是拆成单独文件：多一个"首次运行时还不存在"的
          # 依赖就等于多一个第一次必失败的坑。数字每次都重新算，不留过期读数。
          cat > "$notes" <<EOF
          **本包由 CI 自动发布，不是正式版本。**

          - 提交：\`$git_short\`
          - 版本：\`$version_name\` · versionCode $version_code
          - 只在单元测试与 Rust 测试**全部通过**后才发布；失败的推送不会覆盖这里，所以这个地址永远是能装的版本

          **固定下载地址**（存书签即可，每次都是最新绿灯构建）：

          \`\`\`text
          https://github.com/$REPO/releases/download/ci-latest/app-release.apk
          https://github.com/$REPO/releases/download/ci-latest/app-debug.apk
          \`\`\`

          **校验（SHA-256）**

          \`\`\`text
          $(sha256sum "$release_apk" | cut -d' ' -f1)  app-release.apk
          $(sha256sum "$debug_apk" | cut -d' ' -f1)  app-debug.apk
          \`\`\`

          release 包经过 R8 压缩：改过 proguard-rules.pro 或新引库之后请务必真机冒烟
          （AGENTS §5.5：R8 的问题只能在运行期证伪）。
          EOF

          if gh release view ci-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release edit ci-latest --repo "$REPO" --title "$title" --prerelease --latest=false
          else
            gh release create ci-latest --repo "$REPO" --target "$git_sha" \
              --title "$title" --prerelease --latest=false \
              --notes-file "$notes"
          fi

          # --clobber：每天都在同一个标签上换新版，资产必须就地覆盖
          gh release upload ci-latest \
            android/app/build/outputs/apk/debug/*.apk \
            android/app/build/outputs/apk/release/*.apk \
            --repo "$REPO" --clobber

          gh release edit ci-latest --repo "$REPO" --notes-file "$notes"
