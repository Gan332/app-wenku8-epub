name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  # 缓存水位脚本要删条目（scripts/ci-trim-cache.sh）。只给 contents: write 时其余权限全为 none。
  actions: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build native Compose APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # MiuiX 0.9.4 要求 compileSdk 37。注意 SDK 37 引入小版本号，
          # 公共仓库里没有 platforms;android-37，基础包是 platforms;android-37.0
          # （其 source.properties 为 ApiLevel=37.0 / IsBaseSdk=true）。
          # NDK：cargo-ndk 交叉编译 rust/epub-core（libepub_core.so）需要。
          "$SDKMANAGER" 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.2.12479018'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml') }}

      # 缓存水位控制。必须在 Cache Rust 之后（要先 restore 再算占用），
      # 且放在所有构建步骤之前，这样清出的空间本次构建就能用上。
      - name: Trim Actions cache when near the quota
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_MAX_MB: '10240'
          CACHE_THRESHOLD_PCT: '90'
          CACHE_TARGET_PCT: '70'
        run: bash scripts/ci-trim-cache.sh

      - name: Rust tests
        working-directory: rust
        run: cargo test --locked || cargo test

      - name: Build native epub core
        working-directory: rust
        # cargo-ndk 装一次后进缓存（~/.cargo/bin）；产物 so 拷进 jniLibs（不入库），
        # gradle 自动打包；本地无 so 时 Kotlin 侧 available=false 走 legacy 回退。
        run: |
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armv7-linux-androideabi -t x86_64-linux-android \
            -o ../android/app/src/main/jniLibs \
            build --release -p epub-core

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK (R8)
        working-directory: android
        # 签名口令一律走 env，不直接插值进脚本（避免脚本注入）。
        # 未配置 Secrets 时在脚本内跳过，不退回 debug 签名冒充。
        env:
          HYPERREADER_KEYSTORE: ${{ runner.temp }}/release.keystore
          HYPERREADER_KEYSTORE_B64: ${{ secrets.HYPERREADER_KEYSTORE }}
          HYPERREADER_STORE_PASSWORD: ${{ secrets.HYPERREADER_STORE_PASSWORD }}
          HYPERREADER_KEY_ALIAS: ${{ secrets.HYPERREADER_KEY_ALIAS }}
          HYPERREADER_KEY_PASSWORD: ${{ secrets.HYPERREADER_KEY_PASSWORD }}
        run: |
          if [ -z "$HYPERREADER_KEYSTORE_B64" ] || [ -z "$HYPERREADER_STORE_PASSWORD" ] || [ -z "$HYPERREADER_KEY_ALIAS" ]; then
            echo "::notice::未配置签名 Secrets（HYPERREADER_*），跳过 release 构建"
            exit 0
          fi
          printf '%s' "$HYPERREADER_KEYSTORE_B64" | base64 -d > "$HYPERREADER_KEYSTORE"
          gradle assembleRelease --no-daemon --stacktrace
          rm -f "$HYPERREADER_KEYSTORE"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperreader-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wenku8-epub-studio-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
